<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Bygone Leaderboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="leaderboard">

        <div id="info">
            <span id="timestamp">April 5th 2026 18:11 GMT+3</span>
            <span id="playerCount"></span>
        </div>
        <div id="searchBox">
            <input id="searchInput" type="text" placeholder="Search player...">
            <button id="searchButton">Search</button>
        </div>
        <div class="header">
            <div>Rank</div>
            <div>Player</div>
            <div>Guild</div>
            <div>Score</div>
        </div>

        <div id="rows"></div>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
